<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Barra de navegación - Practica</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: linear-gradient(90deg,#f7f1ff 0%, #fff0f6 100%);
      --glass: rgba(255,255,255,0.6);
      --accent:#ff4da6;
      --muted:#6b7280;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #fafafa;
      color:#111827;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:40px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    /* Contenedor de demostración */
    .demo-wrap{
      width:100%;
      max-width:1100px;
      background:var(--bg);
      border-radius:20px;
      padding:18px;
      box-shadow:0 8px 30px rgba(16,24,40,0.08);
    }

    /* Navbar */
    nav.nav{
      display:flex;
      align-items:center;
      gap:18px;
      padding:10px 16px;
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
      backdrop-filter: blur(6px) saturate(120%);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:inherit;
    }

    .logo{
      width:46px;height:46px;
      border-radius:10px;
      background:linear-gradient(135deg,var(--accent), #7c3aed);
      display:grid;place-items:center;color:white;font-weight:700;box-shadow:0 6px 18px rgba(124,58,237,0.18);
      flex:0 0 46px;
    }

    .brand .title{
      font-weight:700;font-size:18px;letter-spacing:-0.2px
    }

    .nav-links{
      display:flex;gap:12px;align-items:center;margin-left:18px;flex:1;flex-wrap:wrap
    }

    .nav-links a{
      padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;
      transition:all .18s ease;
    }
    .nav-links a:hover{background:rgba(0,0,0,0.04);color:#111}
    .nav-links a.active{background:linear-gradient(90deg, rgba(255,77,166,0.12), rgba(124,58,237,0.06));color:var(--accent);box-shadow:inset 0 -2px 0 rgba(255,77,166,0.06)}

    .search{
      display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;border:1px solid rgba(16,24,40,0.04);box-shadow:0 2px 8px rgba(16,24,40,0.04);
      max-width:340px;width:40%;
    }
    .search input{border:0;outline:0;font-size:14px}

    .actions{display:flex;gap:10px;align-items:center}
    .btn{
      padding:8px 14px;border-radius:12px;border:0;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px
    }
    .btn-ghost{background:transparent;color:var(--muted)}
    .btn-primary{background:linear-gradient(90deg,var(--accent),#7c3aed);color:white;box-shadow:0 6px 20px rgba(124,58,237,0.18)}

    /* Mobile */
    .hamburger{display:none;background:transparent;border:0;padding:8px;border-radius:8px}

    @media (max-width:820px){
      .search{display:none}
      .nav-links{display:none}
      .hamburger{display:inline-flex;margin-left:auto}
      .actions{gap:6px}
    }

    /* Mobile menu panel */
    .mobile-menu{
      display:none;flex-direction:column;gap:8px;padding:12px;margin-top:10px;background:rgba(255,255,255,0.85);border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,0.06)
    }
    .mobile-menu a{padding:10px;border-radius:8px}
    .mobile-menu.show{display:flex}

    /* Small aesthetic footer text */
    .meta{margin-top:12px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="demo-wrap">
    <nav class="nav" role="navigation" aria-label="Principal">
      <a href="#" class="brand">
        <div class="logo">P</div>
        <div>
          <div class="title">Practica</div>
          <div style="font-size:12px;color:var(--muted);font-weight:500;margin-top:2px">Git-Hub</div>
        </div>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="#" class="active">Inicio</a>
        <a href="#">Codigos</a>
        <a href="#">Practicas</a>
      </div>

      <div class="search" role="search" aria-label="Buscar en el sitio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6"></circle></svg>
        <input type="text" placeholder="Buscar ..." />
      </div>

      <div class="actions">
        <button class="btn btn-ghost" title="Cuenta">👤</button>
        <button class="btn btn-primary">Ver</button>

        <button class="hamburger" id="hamburger" aria-expanded="false" aria-label="Abrir menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="#111827" stroke-width="1.6" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <a href="#">Inicio</a>
      <a href="#">Codigos</a>
      <a href="#">Practicas</a>
      <div style="height:1px;background:rgba(16,24,40,0.04);margin:8px 0;border-radius:2px"></div>
      <a href="#" style="font-weight:700">Comprar</a>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', ()=>{
      const shown = mobileMenu.classList.toggle('show');
      hamburger.setAttribute('aria-expanded', shown);
      mobileMenu.setAttribute('aria-hidden', !shown);
    });
  </script>
</body>
</html>
